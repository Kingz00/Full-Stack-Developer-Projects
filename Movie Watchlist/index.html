<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="index.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <!-- HERO -->
    <header class="hero">
        <div class="hero__overlay"></div>

        <div class="hero__content">
            <h1>Find your film</h1>
            <a href="#" class="hero__watchlist-link">
                My Watchlist
            </a>
        </div>
    </header>

    <!-- SEARCH -->
    <section class="search-section">
        <form id="search-form" class="search-form">
            <div class="search-input-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>

                <input id="search-input" name="search-input" type="text" placeholder="Search for a movie">
            </div>

            <button type="submit">
                Search
            </button>
        </form>
    </section>

    <!-- RESULTS -->
    <main id="movies-search-result" class="empty-state">

        <div class="empty-state-content">

            <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="8" y1="3" x2="8" y2="21" />
                <line x1="16" y1="3" x2="16" y2="21" />
                <line x1="3" y1="8" x2="21" y2="8" />
                <line x1="3" y1="16" x2="21" y2="16" />
            </svg>

            <p>Start exploring</p>

    </main>

    <script type="module" src="index.js"></script>
</body>

</html>
