<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Restaurant</title>
    <link rel="stylesheet" href="index.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Smythe&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="container">

    </header>
    <main>
        <section id="menu" class="menu">
            <div id="menu-container" class="container"></div>
        </section>
        <section id="order" class="order">
            <div class="container">
                <div id="order-container" class="order-container">
                    <h2 class="order-title">Your order</h2>
                    <div id="order-items-container" class="order-items-container">

                    </div>
                    <div class="total-price-container">
                        <h2 class="total-price-title">Total price:</h2>
                        <p id="total-price" class="price">26</p>
                    </div>
                    <button id="complete-btn" class="btn complete-btn">Complete order</button>
                </div>
                <div class="feedback-container">
                    <h4 class="feedback-text">Thanks, James! Your order is on its way!</h4>
                </div>
            </div>
        </section>
        <section class="form-container">
            <h3 class="form-title">Enter card details</h3>
            <form id="payment-details">
                <input type="text" name="user-name" placeholder="Enter your name" aria-label="Enter your name" required>
                <input type="text" name="card-number" placeholder="Enter card number" aria-label="Enter card number"
                    minlength="16" maxlength="16" pattern="[0-9]" required>
                <input type="text" name="cvv" placeholder="Enter CVV" aria-label="Enter CVV" minlength="3" maxlength="3"
                    pattern="[0-9]" required>
                <button id="pay-btn" class="btn pay-btn" type="submit">Pay</button>
            </form>
        </section>
    </main>
    <script type="module" src="index.js"></script>
</body>

</html>
