<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plaster&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <title>My Orders | Spiral Sounds</title>
</head>

<body>

    <div class="top-banner">
        <p id="greeting" class="top-banner-greeting"></p>

        <a href="/cart.html" id="cart-banner" class="cart-banner-link"></a>

        <button class="menu-toggle" aria-label="Toggle menu">
            <img src="images/menu.svg" alt="">
        </button>

        <nav class="header-menu" aria-label="Main menu">
            <a href="/orders.html" id="orders-link">My Orders</a>
            <a href="/login.html" id="login">Log in</a>
            <a href="/signup.html" id="signup">Sign up</a>
            <button class="main-btn" id="logout-btn">Log out</button>
        </nav>
    </div>

    <header>
        <a href="/">
            <img src="/images/spiral_logo.png" alt="Spiral Sounds Logo">
        </a>

        <div class="header-text">
            <h1>Spiral Sounds</h1>
            <p class="subhead">The best in vinyl</p>
        </div>
    </header>

    <main class="orders-main">
        <h2>My Orders</h2>

        <p id="orders-message"></p>

        <section id="orders-list" aria-label="Order history"></section>
    </main>

    <footer>
        <p>© Spiral Sounds</p>
    </footer>

    <script src="js/menu.js" type="module"></script>
    <script src="js/orders.js" type="module"></script>

</body>

</html>
