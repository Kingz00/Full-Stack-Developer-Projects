<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scorecard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="index.js" defer></script>
</head>

<body>
    <section id="home">
        <h3>HOME</h3>
        <h1 id="home-count">0</h1>
        <div class="btns">
            <button id="home-btn-1" onclick="homeBtn1()">+1</button>
            <button id="home-btn-2" onclick="homeBtn2()">+2</button>
            <button id="home-btn-3" onclick="homeBtn3()">+3</button>
        </div>
    </section>
    <section id="guest">
        <h3>GUEST</h3>
        <h1 id="guest-count">0</h1>
        <div class="btns">
            <button id="guest-btn-1" onclick="guestBtn1()">+1</button>
            <button id="guest-btn-2" onclick="guestBtn2()">+2</button>
            <button id="guest-btn-3" onclick="guestBtn3()">+3</button>
        </div>
    </section>
</body>

</html>
