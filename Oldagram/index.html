<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oldagram</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <h1>Oldagram</h1>
        <img id="profile-picture" src="./images/user-avatar.jpeg" alt="The profile picture of the user">
    </header>

    <main>
        <section>
            <img id="post-author-avatar" src="./images/avatar-vangogh.jpg" alt="The profile picture of the post author">
            <div>
                <h2 id="post-author-name">Vincent van Gogh</h2>
                <p id="post-author-location">Zudert, Netherlands</p>
            </div>
        </section>

        <section>
            <img id="post-image" src="./images/post-vangogh.jpg" alt="An image uploaded by the post author">
        </section>
        <section>
            <div>
                <img id="like-icon" class="post-icons" src="./images/icon-heart.png" alt="An icon to like the post">
                <img id="comment-icon" class="post-icons" src="./images/icon-comment.png"
                    alt="An icon to add a comment to the post">
                <img id="dm-icon" class="post-icons" src="./images/icon-dm.png"
                    alt="An icon to send the user a direct message">
            </div>
            <h2 id="likes-count">21,492 likes</h2>
            <div>
                <p id="comments"><span>vincey1853</span> just took a few mushrooms lol</p>
            </div>
        </section>
    </main>
    <script src="index.js" type="module"></script>
</body>

</html>
