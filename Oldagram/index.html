<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oldagram</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <img class="title-logo" src="./images/oldagram-logo.png" alt="Oldagram Logo">
        <img id="profile-picture" class="avatar" src="./images/user-avatar.jpeg" alt="The profile picture of the user">
    </header>

    <main id="main">
        <article>
            <section class="author">
                <img id="post-author-avatar" class="avatar" src="./images/avatar-vangogh.jpg"
                    alt="The profile picture of the post author">
                <div class="author-details">
                    <h1 id="post-author-name">Vincent van Gogh</h1>
                    <p id="post-author-location">Zudert, Netherlands</p>
                </div>
            </section>

            <section class="post-image-container">
                <img id="post-image" class="post-image" src="./images/post-vangogh.jpg"
                    alt="An image uploaded by the post author">
            </section>

            <section class="container">
                <div class="post-icons-container">
                    <img id="like-icon" class="post-icons" src="./images/icon-heart.png" alt="An icon to like the post">
                    <img id="comment-icon" class="post-icons" src="./images/icon-comment.png"
                        alt="An icon to add a comment to the post">
                    <img id="dm-icon" class="post-icons" src="./images/icon-dm.png"
                        alt="An icon to send the user a direct message">
                </div>
                <h1 id="likes-count">21,492 likes</h1>
                <div>
                    <p id="comments" class="comments"><span>vincey1853</span> just took a few mushrooms lol</p>
                </div>
            </section>
        </article>
    </main>
    <script src="index.js" type="module"></script>
</body>

</html>
